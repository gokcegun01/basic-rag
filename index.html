<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PDF Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        #chatBox::-webkit-scrollbar, #filesList::-webkit-scrollbar { width: 6px; }
        #chatBox::-webkit-scrollbar-track, #filesList::-webkit-scrollbar-track { background: transparent; }
        #chatBox::-webkit-scrollbar-thumb, #filesList::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        #chatBox::-webkit-scrollbar-thumb:hover, #filesList::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-50 via-purple-50 to-indigo-50 min-h-screen font-sans text-slate-700 antialiased flex items-center justify-center p-4">

    <div class="w-full max-w-3xl bg-white/80 backdrop-blur-md rounded-3xl shadow-xl shadow-purple-100/40 border border-purple-100/50 p-6 md:p-8 h-[85vh] flex flex-col justify-between">
        
        <div class="flex items-center justify-between border-b border-purple-100 pb-4 shrink-0">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 bg-gradient-to-tr from-pink-400 to-purple-500 rounded-2xl flex items-center justify-center text-white text-xl shadow-md shadow-purple-200">
                    ✨
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-purple-600 to-pink-500 bg-clip-text text-transparent py-1">AI PDF Assistant</h1>
                </div>
            </div>
            <div class="text-xs bg-purple-50 text-purple-600 px-3 py-1.5 rounded-full font-semibold border border-purple-100">
                v1.0.0
            </div>
        </div>

        <div id="chatBox" class="flex-1 my-4 overflow-y-auto p-2 space-y-4 flex flex-col">
            <div class="bg-white text-slate-600 self-start p-3.5 rounded-2xl rounded-tl-none text-sm max-w-[85%] shadow-sm border border-purple-50 leading-relaxed">
                Hello! 🌟 Click the paperclip icon in the chat bar below to upload a document, or ask me anything about the already indexed files.
            </div>
        </div>

        <div class="flex flex-col gap-3 shrink-0">
            
            <div class="px-2 flex flex-col gap-1.5">
                <p id="uploadStatus" class="text-xs font-semibold text-amber-500 transition-all"></p>
                
                <details id="indexedFilesSection" class="group hidden">
                    <summary class="flex items-center gap-1.5 text-[10px] font-bold text-purple-400 tracking-wider uppercase cursor-pointer list-none select-none hover:text-purple-600 transition w-max">
                        📂 Indexed Documents (<span id="filesCount">0</span>) <span class="transition-transform duration-200 group-open:rotate-180 text-[8px]">▼</span>
                    </summary>
                    <div id="filesList" class="mt-2 flex flex-col gap-1.5 max-h-28 overflow-y-auto pr-1">
                        </div>
                </details>
            </div>

            <div class="flex items-center gap-2 bg-white/90 border border-purple-100 rounded-2xl p-2 focus-within:ring-2 focus-within:ring-purple-300 transition shadow-sm">
                
                <input type="file" id="pdfFile" accept=".pdf,.txt" class="hidden" onchange="autoUploadPDF()"/>
                
                <label for="pdfFile" class="p-2 text-slate-400 hover:text-purple-600 rounded-xl hover:bg-purple-50 transition cursor-pointer shrink-0" title="Attach PDF or TXT document">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636L9.172 14.828a4 4 0 11-5.656-5.656l9.192-9.192a6 6 0 128.486 8.486L11.996 17.66a2.5 2.5 0 11-3.536-3.536l6.594-6.593" />
                    </svg>
                </label>

                <input type="text" id="questionInput" placeholder="Ask a question about your documents..." class="flex-1 bg-transparent border-0 outline-none text-sm px-2 py-2 text-slate-700 placeholder-slate-400"/>
                
                <button onclick="askQuestion()" id="sendBtn" class="bg-gradient-to-r from-purple-500 to-pink-500 hover:opacity-95 text-white p-2.5 rounded-xl transition shadow-md shadow-purple-200/50 active:scale-95 cursor-pointer shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L6 12zm0 0h7.5" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', fetchFiles);

        async function fetchFiles() {
            const listDiv = document.getElementById('filesList');
            const section = document.getElementById('indexedFilesSection');
            const countSpan = document.getElementById('filesCount');
            
            try {
                const response = await fetch('/files');
                const files = await response.json();
                
                if (files.length > 0) {
                    section.classList.remove('hidden');
                    countSpan.innerText = files.length;
                    listDiv.innerHTML = files.map(file => `
                        <div class="flex items-center gap-2 bg-white border border-purple-100/60 text-purple-700 px-3 py-1.5 rounded-xl text-xs font-semibold shadow-sm truncate">
                            <span class="shrink-0 text-xs">📄</span> 
                            <span class="truncate font-mono text-[11px]">${file}</span>
                        </div>
                    `).join('');
                } else {
                    section.classList.add('hidden');
                }
            } catch (error) {
                console.error("Error fetching files:", error);
            }
        }

        // Ataçtan dosya seçildiği an otomatik yükleyen akıllı fonksiyon
        async function autoUploadPDF() {
            const fileInput = document.getElementById('pdfFile');
            const statusText = document.getElementById('uploadStatus');

            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            statusText.innerText = `⏳ Uploading and indexing '${fileInput.files[0].name}'...`;
            statusText.className = "text-xs font-semibold text-amber-500 animate-pulse";

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
                
                statusText.innerText = `✅ Successfully indexed!`;
                statusText.className = "text-xs font-semibold text-emerald-500";
                
                // Durum yazısını 4 saniye sonra temizle
                setTimeout(() => { statusText.innerText = ""; }, 4000);
                
                await fetchFiles();
            } catch (error) {
                statusText.innerText = "❌ Error processing document.";
                statusText.className = "text-xs font-semibold text-rose-500";
            } finally {
                fileInput.value = ""; // Inputu sıfırla ki aynı dosya tekrar seçilebilsin
            }
        }

        async function askQuestion() {
            const input = document.getElementById('questionInput');
            const chatBox = document.getElementById('chatBox');
            const btn = document.getElementById('sendBtn');
            const question = input.value.trim();

            if (!question) return;

            chatBox.innerHTML += `<div class="bg-gradient-to-r from-purple-500 to-pink-500 text-white self-end p-3.5 rounded-2xl rounded-tr-none text-sm max-w-[80%] shadow-sm font-medium">${question}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            btn.disabled = true;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });
                
                const data = await response.json();

                chatBox.innerHTML += `
                    <div class="bg-white text-slate-700 self-start p-4 rounded-2xl rounded-tl-none text-sm max-w-[85%] space-y-3 shadow-sm border border-purple-50 leading-relaxed">
                        <div class="flex items-center gap-1.5 text-xs font-bold text-purple-600 border-b border-purple-50 pb-1.5">
                            <span>🤖</span> Answer
                        </div>
                        <p class="text-slate-600 font-medium">${data.answer}</p>
                        <div class="pt-2 border-t border-dashed border-slate-100 space-y-1.5 text-xs text-slate-400">
                            <p class="italic text-slate-400/90">📌 <span class="font-semibold text-purple-400">Summary:</span> ${data.summary_sentence}</p>
                            <div class="flex flex-wrap items-center gap-2 pt-1">
                                <span class="bg-purple-50 text-purple-600 px-2 py-0.5 rounded-md font-mono text-[11px] border border-purple-100/50">📄 ${data.source}</span>
                                <span class="bg-rose-50 text-pink-600 px-2 py-0.5 rounded-md text-[11px] font-semibold border border-rose-100/50">🎯 Confidence: ${data.confidence_score}</span>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                chatBox.innerHTML += `<div class="bg-rose-50 text-rose-600 self-start p-3.5 rounded-2xl rounded-tl-none text-sm border border-rose-100">❌ Server did not reply. Please try again.</div>`;
            } finally {
                btn.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        document.getElementById('questionInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') askQuestion();
        });
    </script>
</body>
</html>
